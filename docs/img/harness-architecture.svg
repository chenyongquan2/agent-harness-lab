      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #harness-architecture-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
      #harness-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #harness-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#harness-architecture-root .diagram-container { overflow-x: visible; }
}</style>

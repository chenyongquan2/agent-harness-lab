<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harness-architecture-title harness-architecture-desc" id="harness-architecture-root">
        <title id="harness-architecture-title">Harness runtime architecture</title>
        <desc id="harness-architecture-desc">Channels feed an executor that runs the AgentLoop; the loop is limited by guardrails, fed by memory, calls tools through a registry and delegates to sub-agents, while a domain package supplies the tools, prompt and policy and a tracer records every span.</desc>

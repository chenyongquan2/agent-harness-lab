<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eval-gate-flow-title eval-gate-flow-desc" id="eval-gate-flow-root">
        <title id="eval-gate-flow-title">Evaluation gate flow</title>
        <desc id="eval-gate-flow-desc">Dev-split cases are run through the real AgentLoop several times, scored with confidence intervals, and compared to a stored baseline with a tolerance declared by the domain; a regression exits with code 3, while production traces are triaged and human-labelled into new cases.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #eval-gate-flow-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
      #eval-gate-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #eval-gate-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#eval-gate-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="eval-gate-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="eval-gate-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="eval-gate-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <path d="M220,128 H270" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <path d="M450,128 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <rect x="458.5" y="108" width="33" height="12" rx="2" fill="#f5f5f5"/>
        <text x="475" y="117" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPANS</text>
        <path d="M680,128 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <rect x="681" y="108" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="700" y="117" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCORES</text>
        <path d="M880,128 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <rect x="888.5" y="108" width="23" height="12" rx="2" fill="#f5f5f5"/>
        <text x="900" y="117" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <path d="M800,176 V244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <rect x="813" y="200" width="18" height="12" rx="2" fill="#f5f5f5"/>
        <text x="822" y="209" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <path d="M760,372 H680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <rect x="706" y="352" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="361" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCAN</text>
        <path d="M500,372 H450" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <path d="M270,372 H138 Q130,372 130,364 V160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>

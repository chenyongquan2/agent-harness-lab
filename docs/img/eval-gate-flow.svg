        <rect x="40" y="96" width="180" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="130" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Eval cases</text>
        <text x="130" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dev split gates; held-out never</text>
        <rect x="270" y="96" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="96" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Run real AgentLoop</text>
        <text x="360" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">N samples, isolated tracer</text>
        <rect x="500" y="96" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="96" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="590" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Metrics with t-CI</text>
        <text x="590" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tool F1, slots, task success</text>
        <polygon points="800,80 880,128 800,176 720,128" fill="#f5f5f5"/>
        <polygon points="800,80 880,128 800,176 720,128" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="800" y="125" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Regressed?</text>
        <text x="800" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">vs baseline, tolerance</text>
        <rect x="920" y="108" width="100" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="920" y="108" width="100" height="40" rx="20" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="970" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Exit 3</text>
        <rect x="730" y="244" width="140" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="730" y="244" width="140" height="40" rx="20" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="800" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pass, exit 0</text>
        <rect x="500" y="340" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="340" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="590" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Triage</text>
        <text x="590" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">objective bad-case signals</text>
        <rect x="270" y="340" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="340" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Human labels</text>
        <text x="360" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">expected result, never guessed</text>
        <rect x="760" y="340" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="340" width="180" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="850" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Production traces</text>
        <text x="850" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JSONL, errors always kept</text>
        <line x1="30" y1="436" x2="1010" y2="436" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="442" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="138" y="451" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">FOCAL: THE GATE, TOLERANCE FROM THE DOMAIN</text>
        <line x1="480" y1="448" x2="508" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-gate-flow-arrow)"/>
        <text x="518" y="451" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">FLOW</text>
      </svg>
